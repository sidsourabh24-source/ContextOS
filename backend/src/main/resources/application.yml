server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: contextos-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/contextos_db
    username: contextos_user
    password: contextos_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

contextos:
  vector:
    dimension: 1536
  security:
    api-key-header: X-ContextOS-API-Key
